# Render Blueprint for the DraftCheck web demo. See docs/ARCHITECTURE.md §4.13.
# Secrets (the two API keys) are sync: false — Render asks for them in the dashboard
# when the Blueprint is first created; their values never live in this file.
services:
  - type: web
    name: draftcheck
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn draftcheck.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: LLM_PROVIDER
        value: baseten
      - key: BASETEN_BASE_URL
        value: https://inference.baseten.co/v1
      - key: BASETEN_MODEL
        value: meta-models/muse-spark-open-1026
      - key: BASETEN_API_KEY
        sync: false
      - key: META_BASE_URL
        value: https://api.meta.ai/v1
      - key: META_MODEL
        value: muse-spark-1.2
      - key: META_API_KEY
        sync: false
      # Render terminates TLS in a proxy and sets X-Forwarded-For; see limits.py.
      - key: TRUST_PROXY
        value: "1"
      # Page-1 render size for uploads; smaller than the CLI's 200 dpi / 2400 px so an
      # upload fits the free plan's RAM. See docs/ARCHITECTURE.md §4.13.
      - key: DRAFTCHECK_RENDER_DPI
        value: "150"
      - key: DRAFTCHECK_MAX_SIDE
        value: "1800"
      # Longest one model call may take before the request answers 504. The CLI has no
      # such limit. See docs/ARCHITECTURE.md §4.13.
      - key: DRAFTCHECK_MODEL_TIMEOUT_SECONDS
        value: "90"
      # Automatic fallback: Muse Spark Open on Baseten stays the default, but a call it has
      # not answered in 45 s (or that fails to connect, or gets a 5xx) is sent once to the
      # Meta Model API instead. An empty provider turns this off. See docs/ARCHITECTURE.md §4.14.
      - key: DRAFTCHECK_PRIMARY_TIMEOUT_SECONDS
        value: "45"
      - key: DRAFTCHECK_FALLBACK_PROVIDER
        value: meta
